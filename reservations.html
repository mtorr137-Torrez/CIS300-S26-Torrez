<main>
    <h2>Reservations at Pacific Trails</h2>

    <p>Contact us today to reserve your luxury yurt at Pacific Trails Resort.</p>

    <p>Required fields are marked with an asterisk (*).</p>

    <form>
        <label for="myName">*Name:</label><br>
        <input type="text" id="myName" name="myName" required><br><br>

        <label for="myEmail">*Email:</label><br>
        <input type="email" id="myEmail" name="myEmail" required><br><br>

        <label for="myArrival">Arrival Date:</label><br>
        <input type="date" id="myArrival" name="myArrival"><br><br>

        <label for="myNights">Nights:</label><br>
        <input type="number" id="myNights" name="myNights" min="1"><br><br>

        <input type="submit" value="Submit Request">
    </form>
</main>
